version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: alberta_plants_db
    environment:
      POSTGRES_DB: PlantCareDb
      POSTGRES_USER: plant_user
      POSTGRES_PASSWORD: WinterPlantPassword123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plant_user -d PlantCareDb"]
      interval: 5s
      timeout: 5s
      retries: 10

  web-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alberta_plants_api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres-db;Port=5432;Database=PlantCareDb;Username=plant_user;Password=WinterPlantPassword123!"
    depends_on:
      postgres-db:
        condition: service_healthy

volumes:
  postgres_data: