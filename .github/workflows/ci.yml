name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore PlantInventoryApi.Tests

      - name: Build
        run: dotnet build PlantInventoryApi.Tests --no-restore -c Release

      - name: Test
        run: dotnet test PlantInventoryApi.Tests --no-build -c Release